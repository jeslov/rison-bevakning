name: Rison Bevakning

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  bevakning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installera beroenden
        run: pip install requests

      - name: Kör bevakning
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python bevakning_serper.py

      - name: Publicera rapport
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f index.html bedomning_cache.json testart_artiklar.json sedda_artiklar.json zeitgeist_cache.json dagsaktuella_cache.json
          git diff --staged --quiet || git commit -m "Uppdatera rapport $(date '+%Y-%m-%d')"
          git push
